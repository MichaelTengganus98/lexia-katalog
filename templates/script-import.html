{% load static %}
<script>
  /* live search suggestions — progressive enhancement, no framework */
  (function () {
    var box = document.querySelector('[data-search-suggest]');
    if (!box) return;
    var input = box.querySelector('input[name="mesin"]');
    var out = box.querySelector('.search-suggest');
    var url = box.getAttribute('data-suggest-url');
    var token = box.getAttribute('data-csrf');
    var timer;
    function clear() { if (out) { out.innerHTML = ''; } }
    input.addEventListener('input', function () {
      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 2) { clear(); return; }
      timer = setTimeout(function () {
        var body = new URLSearchParams(); body.append('mesin', q);
        fetch(url, { method: 'POST', headers: { 'X-CSRFToken': token }, body: body })
          .then(function (r) { return r.json(); })
          .then(function (data) {
            if (!out) return;
            out.innerHTML = '';
            (data.list || []).forEach(function (name) {
              var a = document.createElement('a');
              a.textContent = name;
              a.href = '/search/?mesin=' + encodeURIComponent(name);
              out.appendChild(a);
            });
          }).catch(clear);
      }, 200);
    });
    document.addEventListener('click', function (e) {
      if (!box.contains(e.target)) clear();
    });
  })();
</script>
